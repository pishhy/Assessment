{% extends "layout.html" %}
{% block content %}


<div class="burger-grid">
    {% for item in results %}
    <div class="burger-card">
        <img src="/{{ item.photo }}" alt="{{ item.burgers }}">
        <h2>{{ item.burgers }}</h2>
        <p>{{ item.price }}</p>
        <h3>Ingredients: </h3>
        <p>{{ item.ingredients }}</p>
        <h3>Condiments: </h3>
        <p>{{ item.condiments }}</p>
        <form action="{{ url_for('add_burger_to_cart', product_id=item.id) }}" method="post">
            <button type="submit" class="add-now-btn">Add Now</button>
        </form>
    </div>
    {% endfor %}
</div>

<div class="menus-sides-button">
    <a href="/sides">Sides</a>
</div>

{% endblock %}
