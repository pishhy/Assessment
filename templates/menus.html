{% extends "layout.html" %}
{% block content %}


<div class="burger-grid">
    {% for item in results %}
    <div class="burger-card">
        <img src="/{{ item.photo }}" alt="{{ item.burgers }}">
        <h2>{{ item.burgers }}</h2>
        <p>{{ item.price }}</p>
        <h3>Ingredients: </h3>
        <p>{{ item.ingredients }}</p>
        <h3>Condiments: </h3>
        <p>{{ item.condiments }}</p>
        <button type="button" class="add-now-btn">Add Now</button>
    </div>
    {% endfor %}
</div>

<div class="menus-sides-button">
    <a href="/sides" style="background-color: black; color: #C78D22;">Sides</a>
</div>

{% endblock %}
