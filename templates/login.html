{% extends "layout.html" %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2 class="auth-title">Hiiiii, lets get your information!</h2>
        <!-- helper text with a link pointing new users to the signup page -->
        <p class="auth-subtext">If you're a first-time user, please <a href="/signup" class="auth-link">Sign Up</a> first!</p>

        <!-- form that sends the username/password to /login using POST when submitted -->
        <form action="/login" method="post" class="login-form">

            <!-- wrapper for one label + input pair -->
            <div class="auth-field">
                <!-- visible text label linked to the username input below via "for" -->
                <label for="username">Username</label>
                <!-- positions the icon span inside the input that follows -->
                <div class="auth-input-wrap">
                    <!-- text box for the username, capped at 25 characters, required before the form can submit -->
                    <input type="text" id="username" maxlength="25" name="username" class="auth-input" required>
                <!-- closes the icon-positioning wrapper -->
                </div>
            <!-- closes this label+input field group -->
            </div>

            <div class="auth-field">
                <label for="password">Password</label>
                <div class="auth-input-wrap">
                    <!-- password box; type="password" masks each character as a dot while typing -->
                    <input type="password" id="password" name="password" class="auth-input" required>
                </div>
            </div>

            <!-- submits the form to /login when clicked -->
            <button type="submit" class="form-button">Login</button>
        <!-- closes the <form> -->
        </form>
    <!-- closes the auth-card -->
    </div>
<!-- closes the auth-page wrapper -->
</div>

<!-- marks the end of the content block started above -->
{% endblock %}
